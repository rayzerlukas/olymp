name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: YAML lint
        run: pipx run yamllint --strict .
      - name: Store, manifests and compose files
        run: sh scripts/validate.sh
