# apollo as an Umbrel app. The app code and its image are built in apollo's own
# repository; this file only wires the released image together. It is generated from
# apollo's umbrel/olymp-apollo/ by apollo's Release workflow (scripts/update_store.py):
# change it there, not in the store.
#
# Data (bind mounts under ${APP_DATA_DIR}/data, on the Umbrel's internal disk):
#   postgres/  database      backups/  pg_dump files      config/  apollo.env (secrets)
#   blobs/     fetched bodies (the blob store, APOLLO_BLOB_DIR)
#
# Three apollo processes (decisions 0025, 0028): `worker` migrates the database and runs
# batch work; `intake` runs live polls and streams; `web` serves the GUI and its read-only
# JSON API. The browser reaches `web` only through umbrelOS's app proxy (its login in
# front, port 8472 of umbrel-app.yml); nothing is published.
# Start order: postgres -> backup-script -> pre-upgrade (a labelled backup when the image
# version changed) -> worker (migrates) -> intake, web and backup.
#
# Memory: the Umbrel (16 GB) is shared with other apps, so every service has a limit; the
# long-running ones together at most 6.8 GB (docs/deployment.md#memory).

x-apollo: &apollo
  image: ghcr.io/rayzerlukas/apollo:0.1.0@sha256:5202e6a01e55e075b53611d52e8571f6514596eb3e021656e582f66a527eed3d
  user: "1000:1000"
  restart: on-failure
  environment:
    APOLLO_ENV_FILE: /data/config/apollo.env  # secrets; optional, created by the owner
    APOLLO_DATABASE_URL: postgresql+asyncpg://apollo:apollo@postgres:5432/apollo
    APOLLO_LOG_JSON: "true"
    APOLLO_BLOB_DIR: /data/blobs
  volumes:
    - ${APP_DATA_DIR}/data/config:/data/config:ro
    - ${APP_DATA_DIR}/data/blobs:/data/blobs

x-backup-env: &backup-env
  PGHOST: postgres
  PGUSER: apollo
  PGPASSWORD: apollo
  PGDATABASE: apollo
  BACKUP_DIR: /backups

services:
  app_proxy:  # umbrelOS adds the image; this names the service and port it forwards to
    environment:
      APP_HOST: olymp-apollo_web_1
      APP_PORT: 8080

  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: "1000:1000"
    restart: on-failure
    command: ["postgres", "-c", "shared_buffers=512MB"]
    environment:
      # Only reachable inside the app's network; not published.
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: apollo
      POSTGRES_DB: apollo
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo -d apollo"]
      interval: 5s
      retries: 10
    stop_signal: SIGINT  # fast shutdown: aborts open transactions, then a clean checkpoint
    stop_grace_period: 60s  # the checkpoint must finish; a kill means crash recovery
    shm_size: 256mb  # parallel queries; Docker's default /dev/shm is 64 MB
    mem_limit: 3g

  worker:  # migrates the database at start, then runs batch work and the notifier
    # (digest and ops messages; Telegram's token and chat id come from config/apollo.env,
    # docs/operations.md#notifications – only this service sends)
    <<: *apollo
    command: ["worker"]
    stop_grace_period: 30s  # SIGTERM gives running jobs 10 s, then the worker exits
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      pre-upgrade:
        condition: service_completed_successfully  # backed up (or a fresh dump) first
    healthcheck:  # heartbeat younger than 5 minutes
      test: ["CMD", "apollo", "health", "worker"]
      interval: 60s
      timeout: 20s
      start_period: 5m
      start_interval: 5s

  intake:  # live polls and streams; waits for the migrated database, never migrates
    <<: *apollo
    command: ["intake"]
    stop_grace_period: 30s  # SIGTERM flushes the streams' open minutes and lets jobs finish
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:  # heartbeat younger than 2 minutes and event-loop lag under 5 s
      test: ["CMD", "apollo", "health", "intake"]
      interval: 30s
      timeout: 20s
      start_period: 2m
      start_interval: 5s

  web:  # the GUI and its read-only JSON API (decision 0028); a failure never touches intake
    <<: *apollo
    command: ["web"]
    environment:  # least privilege: the database only; no secrets file, no blob store
      APOLLO_DATABASE_URL: postgresql+asyncpg://apollo:apollo@postgres:5432/apollo
      APOLLO_LOG_JSON: "true"
      # Reached only through the app proxy, behind the Umbrel login; the Host it forwards
      # is the name the owner typed (umbrel.local, an IP, a tailnet name), so any host is
      # accepted here (docs/configuration.md, APOLLO_WEB_TRUSTED_HOSTS).
      APOLLO_WEB_TRUSTED_HOSTS: "*"
    volumes: []
    stop_grace_period: 10s
    mem_limit: 320m
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy  # migrations done
    healthcheck:  # answers its ping (no database needed)
      test: ["CMD", "apollo", "health", "web"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 2s

  # The backup script ships in the apollo image (same version as the app); this one-shot
  # service copies it next to the backups, where the backup services run it with pg_dump,
  # and records the image's version for pre-upgrade. It always exits 0.
  backup-script:
    image: ghcr.io/rayzerlukas/apollo:0.1.0@sha256:5202e6a01e55e075b53611d52e8571f6514596eb3e021656e582f66a527eed3d
    user: "1000:1000"
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:  # always exits 0: a failure here must never keep the worker from starting
      - >-
        cp /opt/apollo/backup/backup.sh /backups/backup.sh
        || echo "backup-script: could not copy the backup script; the previous one stays";
        rm -f /backups/.image-version;
        echo "$$APP_VERSION" > /backups/.image-version
        || echo "backup-script: could not record the image version";
        exit 0
    mem_limit: 256m
    volumes:
      - ${APP_DATA_DIR}/data/backups:/backups

  pre-upgrade:  # one-shot: a labelled backup before a new image version migrates
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: "1000:1000"
    restart: "no"
    init: true  # SIGTERM ends a running pg_dump instead of waiting to be killed
    # Exits 1 (and so keeps the worker from migrating) only when no pre-upgrade dump could
    # be written and no readable dump younger than 24 h exists (docs/deployment.md#update).
    command: ["sh", "/backups/backup.sh", "pre-upgrade"]
    environment: *backup-env
    mem_limit: 512m
    volumes:
      - ${APP_DATA_DIR}/data/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      backup-script:
        condition: service_completed_successfully

  backup:  # daily pg_dump into data/backups, rotation, heartbeat `backup`
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    user: "1000:1000"
    restart: on-failure
    init: true  # forwards SIGTERM to the backup loop, which stops at once (backup.sh)
    command: ["sh", "/backups/backup.sh", "loop"]
    environment: *backup-env
    mem_limit: 512m
    volumes:
      - ${APP_DATA_DIR}/data/backups:/backups
    depends_on:
      backup-script:
        condition: service_completed_successfully
      worker:
        condition: service_healthy  # migrations done: the heartbeats table exists
